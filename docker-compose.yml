name: phinix-media

services:
  website:
    image: phinix-media-site:0.8.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "${PHINIX_BIND:-127.0.0.1}:${PHINIX_HTTP_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

